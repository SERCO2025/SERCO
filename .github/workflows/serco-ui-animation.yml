name: SERCO UI animation update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/serco-ui-animation.yml
permissions:
  contents: write
jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.gallery-image { width:100%; height:400px; object-fit:cover; position:absolute; top:0; left:0; opacity:0; transition:opacity .8s ease-in-out; }\n        .gallery-image.active { opacity:1; }\n        #gallery-container { height:400px; position:relative; }'
          new='.gallery-image { width:100%; height:400px; object-fit:cover; position:absolute; top:0; left:0; opacity:1; transform:translateX(100%); transition:transform .8s ease-in-out; }\n        .gallery-image.active { opacity:1; transform:translateX(0); }\n        .gallery-image.slide-out-left { transform:translateX(-100%); }\n        .gallery-image.slide-out-right { transform:translateX(100%); }\n        .gallery-image.slide-in-left { transform:translateX(-100%); }\n        .gallery-image.slide-in-right { transform:translateX(100%); }\n        #gallery-container { height:400px; position:relative; overflow:hidden; }'
          if old not in s: raise SystemExit('gallery CSS not found')
          s=s.replace(old,new,1)
          old_menu='<div id="mobile-menu" class="hidden md:hidden bg-card border-t border-card">'
          new_menu='<div id="mobile-menu" class="md:hidden bg-card border-t border-card mobile-menu-animated">'
          if old_menu not in s: raise SystemExit('menu markup not found')
          s=s.replace(old_menu,new_menu,1)
          s=s.replace("onclick=\"document.getElementById('mobile-menu').classList.add('hidden')\"","onclick=\"document.getElementById('mobile-menu').classList.remove('menu-open')\"")
          old_toggle="menuButton.addEventListener('click', () => { mobileMenu.classList.toggle('hidden'); });"
          new_toggle="menuButton.addEventListener('click', () => { mobileMenu.classList.toggle('menu-open'); });"
          if old_toggle not in s: raise SystemExit('menu toggle not found')
          s=s.replace(old_toggle,new_toggle,1)
          anchor='        @media(max-width:640px){\n'
          css='        .mobile-menu-animated { max-height:0; overflow:hidden; opacity:0; transform:translateY(-100%); transition:max-height .35s ease, opacity .35s ease, transform .35s ease; }\n        .mobile-menu-animated.menu-open { max-height:500px; opacity:1; transform:translateY(0); }\n        .mobile-menu-animated.menu-closing { transform:translateX(100%); opacity:0; }\n\n'
          if anchor not in s: raise SystemExit('media anchor not found')
          s=s.replace(anchor,css+anchor,1)
          pattern=re.compile(r"        function showImage\(direction\)\{.*?\n        prevBtn\.addEventListener",re.S)
          replacement="""        function showImage(direction){
            if(validImages.length===0)return;
            const previousIndex=currentImageIndex;
            if(direction==='next')currentImageIndex=(currentImageIndex+1)%validImages.length;
            else if(direction==='prev')currentImageIndex=(currentImageIndex-1+validImages.length)%validImages.length;
            else return;
            const previousImg=galleryContainer.querySelector('.gallery-image[data-index=\\\"'+previousIndex+'\\\"]');
            const currentImg=galleryContainer.querySelector('.gallery-image[data-index=\\\"'+currentImageIndex+'\\\"]');
            if(!currentImg)return;
            const forward=direction==='next';
            const classes=['active','slide-in-left','slide-in-right','slide-out-left','slide-out-right'];
            if(previousImg)previousImg.classList.remove(...classes);
            currentImg.classList.remove(...classes);
            if(previousImg)previousImg.classList.add(forward?'slide-out-left':'slide-out-right');
            currentImg.classList.add(forward?'slide-in-right':'slide-in-left');
            requestAnimationFrame(()=>{ currentImg.classList.remove('slide-in-right','slide-in-left'); currentImg.classList.add('active'); });
            setTimeout(()=>{if(previousImg)previousImg.classList.remove('active','slide-out-left','slide-out-right');},850);
            if(fullscreenViewer.classList.contains('open'))updateFullscreenImage();
        }
        prevBtn.addEventListener"""
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit('showImage not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/serco-ui-animation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/serco-ui-animation.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Animar carrusel y menu de SERCO'
          git push