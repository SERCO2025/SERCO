<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Construcción y Urbanización Serco | Pavimentación y Estructural | Mexicali, Baja California</title>

    <link rel="icon" type="image/jpeg" href="favi.jpg">

    <meta name="description" content="Serco ofrece servicios integrales de Construcción Estructural, Pavimentación, Señalizacion y Cobertura Aérea en Mexicali y Baja California. Soluciones de alta precisión.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {}
                }
            }
        }
    </script>

    <style>
        :root {
            --color-light-bg: #DFDFDF;
            --color-light-text: #000000;
            --color-light-card: #ffffff;
            --color-light-soft: #f1f5f9;
            --color-light-border: #cbd5e1;
            --color-dark-bg: #0f172a;
            --color-dark-text: #f1f5f9;
            --color-primary: #009bff;
            --color-accent: #34D399;
            --color-derived: #1AB4C8;
            --navbar-height: 57px;
            --contador-height: 2rem;
            --total-header-height: 0rem;
        }

        .dark { background-color: var(--color-dark-bg); color: var(--color-dark-text); }
        .dark .bg-main { background-color: var(--color-dark-bg); }
        .dark .bg-card { background-color: #1e293b; }
        .dark .text-card-text { color: var(--color-dark-text); }
        .dark .text-primary { color: var(--color-primary); }
        .dark .text-accent { color: var(--color-accent); }
        .dark .text-derived { color: var(--color-derived); }
        .dark .border-card { border-color: #334155; }
        .dark input, .dark textarea { background-color: #1e293b; color: var(--color-dark-text); border-color: #334155; }

        .light { background-color: var(--color-light-bg); color: var(--color-light-text); }
        .light .bg-main { background-color: var(--color-light-bg); }
        .light .bg-card { background-color: var(--color-light-card); }
        .light .text-card-text { color: var(--color-light-text); }
        .light .text-primary { color: var(--color-primary); }
        .light .text-accent { color: var(--color-accent); }
        .light .text-derived { color: var(--color-derived); }
        .light .border-card { border-color: var(--color-light-border); }
        .light input, .light textarea { background-color: var(--color-light-soft); color: #000000; border-color: var(--color-light-border); }
        .light .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -2px rgba(0,0,0,.05); }

        .light .text-white { color: #000000 !important; }
        .light .text-gray-200,
        .light .text-gray-300,
        .light .text-gray-400,
        .light .text-gray-500,
        .light .text-gray-600,
        .light .text-gray-700,
        .light .text-gray-800,
        .light .text-gray-900 { color: #000000 !important; }
        .light .bg-black { background-color: #ffffff !important; }
        .light .bg-gray-100,
        .light .bg-gray-200,
        .light .bg-gray-300 { background-color: var(--color-light-soft) !important; }
        .light .border-gray-200,
        .light .border-gray-300,
        .light .border-gray-400 { border-color: var(--color-light-border) !important; }
        .light .dark\\:hover\\:bg-gray-700:hover { background-color: #e2e8f0 !important; }

        .light #inicio .absolute.inset-0.z-0 { background-color: #ffffff !important; }
        .light #inicio .absolute.inset-0.z-10 { background-color: #ffffff !important; opacity: .16 !important; }
        .light #inicio .text-shadow { text-shadow: 1px 1px 3px rgba(255,255,255,.9); }
        .light #inicio .text-white { color: #000000 !important; }

        .light .btn-accent { color: #ffffff !important; }
        .light .btn-submit { color: #ffffff !important; }

        .light .contador-container { background-color: #ffffff; border-bottom: 1px solid var(--color-light-border); }
        .light .contador-estilo { color: #000000; }

        .light #cobertura .bg-main { background: linear-gradient(to top, #D9D9D9 0%, #FFFFFF 100%); }
        .light #cobertura .text-card-text { color: #000000; }

        .light #prev-btn, .light #next-btn {
            background-color: rgba(255,255,255,.88) !important;
            color: #000000 !important;
        }

        .icon-email { color: #38BDF8 !important; }
        .icon-map { color: #EF0000 !important; }
        .icon-phone { color: #FFD000 !important; }
        .icon-whatsapp { color: #25D366 !important; }
        .icon-facebook { color: #1877F2 !important; }

        html { scroll-behavior: smooth; scroll-padding-top: 0; }
        section { scroll-margin-top: var(--total-header-height); }
        #inicio { height: calc(100vh - (var(--navbar-height) + var(--contador-height))); max-height: 100vh; }
        .text-shadow { text-shadow: 2px 2px 4px rgba(0,0,0,.7); }

        .gallery-image { width:100%; height:400px; object-fit:cover; position:absolute; top:0; left:0; opacity:0; transition:opacity .8s ease-in-out; }
        .gallery-image.active { opacity:1; }
        #gallery-container { height:400px; position:relative; }
        .logo-img { height:40px; width:auto; }
        .hero-logo-img { width:60vw; max-width:600px; height:auto; margin-bottom:2rem; }
        @media (max-width:900px) and (orientation:landscape) {
            .hero-logo-img { width:40vw; max-width:40vw; }
            #inicio {
                height:calc(100dvh - var(--navbar-height));
                max-height:none;
                min-height:430px;
            }
            #inicio .contador-container {
                position:absolute;
                top:0;
                left:0;
                z-index:30;
            }
            #inicio .absolute.inset-0.z-0,
            #inicio .absolute.inset-0.z-10,
            #inicio .absolute.inset-0.z-20 {
                top:var(--contador-height) !important;
                height:calc(100% - var(--contador-height)) !important;
            }
            #inicio .absolute.inset-0.z-20 {
                align-items:center;
                padding-top:0;
                padding-bottom:0;
            }
        }

        /* En pantallas pequeñas, la navbar ocupa el 70% de su altura original. */
        @media (max-width:900px) {
            :root { --navbar-height:40px; }
            header > div:first-child { height:40px !important; }
            .logo-img { height:28px; }
            #theme-toggle, #menu-button { padding:.25rem; }
            #theme-toggle i, #menu-button i { font-size:1rem; }
        }

        .btn-accent { background-color:var(--color-accent); box-shadow:0 0 15px color-mix(in srgb,var(--color-accent) 60%,transparent); }
        .btn-accent:hover { filter:brightness(1.25); box-shadow:0 0 25px color-mix(in srgb,var(--color-accent) 90%,transparent); }
        .btn-accent:active { box-shadow:0 0 30px color-mix(in srgb,var(--color-accent) 100%,transparent); }
        .btn-submit { background-color:var(--color-primary); color:white; transition:background-color .3s,color .3s,transform .3s; }
        .dark .btn-submit:hover { background-color:white; color:black; }
        .light .btn-submit:hover { background-color:black; color:white; }

        .contador-container { height:var(--contador-height); background-color:#000; display:flex; justify-content:center; align-items:center; position:relative; z-index:20; width:100%; }
        .contador-estilo { text-align:center; padding:.5rem 1rem; color:white; font-size:.75rem; }
        #inicio .absolute.inset-0.z-0,
        #inicio .absolute.inset-0.z-10,
        #inicio .absolute.inset-0.z-20 { top:var(--contador-height) !important; height:calc(100% - var(--contador-height)); }

        #service-content-wrapper { position:relative; overflow:hidden; }
        .service-image-preview { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0; z-index:10; transform:translateX(-100%); transition:transform .5s ease-out,opacity .5s ease-out; }
        .service-image-preview.slide-in { opacity:1; transform:translateX(0); }
        .service-image-preview.slide-out { opacity:0; transform:translateX(100%); }

        .announcement-slot { display:block; width:100%; }
        .announcement-slot:empty { display:none; }
        .announcement { width:min(1100px,calc(100% - 2rem)); margin:2rem auto; padding:1.5rem 2rem; box-sizing:border-box; overflow:hidden; position:relative; text-align:center; }
        .announcement-content { position:relative; z-index:2; }
        .announcement-title,.announcement-body { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
        .announcement-title { margin-bottom:.75rem; }
        .announcement-image { position:absolute; max-width:80%; max-height:80%; object-fit:contain; pointer-events:none; }
        .announcement-image.behind { z-index:1; left:50%; top:50%; transform:translate(-50%,-50%); }
        .announcement-image.left { z-index:3; left:1rem; top:50%; transform:translateY(-50%); }
        .announcement-image.right { z-index:3; right:1rem; top:50%; transform:translateY(-50%); }
        .announcement-image.hidden { display:none; }
    </style>
</head>
<body class="bg-main font-sans transition-colors duration-500">
    <header class="sticky top-0 z-50 bg-card bg-opacity-95 shadow-lg border-b border-card transition-colors duration-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-[57px]">
            <a href="#inicio" class="flex items-center"><img src="./logo.png" alt="Logo Serco" class="logo-img"></a>
            <nav class="hidden md:flex space-x-8 items-center">
                <a href="#servicios" class="text-card-text hover:text-primary transition duration-300 font-medium">Servicios</a>
                <a href="#proyectos" class="text-card-text hover:text-primary transition duration-300 font-medium">Proyectos</a>
                <a href="#cobertura" class="text-card-text hover:text-primary transition duration-300 font-medium">Cobertura</a>
                <a href="#contacto" class="text-card-text hover:text-primary transition duration-300 font-medium">Contacto</a>
            </nav>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-full text-card-text hover:bg-gray-200 dark:hover:bg-gray-700 transition duration-300"><i class="fas fa-moon text-xl"></i></button>
                <button id="menu-button" class="md:hidden text-card-text focus:outline-none p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition duration-300"><i class="fas fa-bars text-xl"></i></button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-card border-t border-card">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 flex flex-col">
                <a href="#servicios" class="text-card-text hover:bg-gray-200 dark:hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Servicios</a>
                <a href="#proyectos" class="text-card-text hover:bg-gray-200 dark:hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Proyectos</a>
                <a href="#cobertura" class="text-card-text hover:bg-gray-200 dark:hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Cobertura</a>
                <a href="#contacto" class="text-card-text hover:bg-gray-200 dark:hover:bg-gray-700 block px-3 py-2 rounded-md text-base font-medium" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Contacto</a>
            </div>
        </div>
    </header>

    <section id="inicio" class="relative overflow-hidden">
